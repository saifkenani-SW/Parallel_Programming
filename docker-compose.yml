services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=password
      - DATABASE_NAME=parallel_programming_app
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/parallel_programming_app?schema=public
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nest-network

  postgres:
    image: postgres:15
    container_name: parallel_programming_app
    environment:
      POSTGRES_DB: parallel_programming_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parallel_programming_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nest-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - nest-network

networks:
  nest-network:
    driver: bridge

volumes:
  postgres_data:
