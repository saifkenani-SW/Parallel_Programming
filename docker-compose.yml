services:

  api:
    container_name: parallel_programming_api_container
    image: node:24-alpine
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    ports:
      - "3000:3000"
    command: npm run start:dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parallel_programming
      POSTGRES_PASSWORD: parallel_programming
      POSTGRES_DB: parallel_programming_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: parallel_programming_redis_container
    image: redis:7
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:


